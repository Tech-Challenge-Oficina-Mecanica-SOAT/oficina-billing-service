apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-local-config
  namespace: oficina-billing-local
data:
  ASPNETCORE_ENVIRONMENT: Development
  Database__MigrateOnStartup: "true"
  Swagger__Enabled: "true"
  Secrets__Enabled: "false"
  Messaging__Provider: Log
  Messaging__ConsumerEnabled: "false"
  Outbox__Enabled: "false"
  MercadoPago__UseFake: "true"
  MercadoPago__UseSandbox: "true"
  MercadoPago__ValidateSignature: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oficina-billing-local
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oficina-billing-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: oficina_billing
            - name: POSTGRES_USER
              value: billing_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-local
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - billing_user
                - -d
                - oficina_billing
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-billing-service
  namespace: oficina-billing-local
spec:
  type: ClusterIP
  selector:
    app: oficina-billing-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
  namespace: oficina-billing-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-billing-service
  template:
    metadata:
      labels:
        app: oficina-billing-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 128Mi
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U billing_user -d oficina_billing; do sleep 2; done
      containers:
        - name: billing
          image: oficina-billing:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-billing-local-config
          env:
            - name: ConnectionStrings__BillingDb
              valueFrom:
                secretKeyRef:
                  name: billing-db-local
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
