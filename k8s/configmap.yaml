apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: oficina
data:
  Services__OsService__BaseUrl: "http://oficina-os-service.oficina.svc.cluster.local"
  Services__CadastrosService__BaseUrl: "http://oficina-cadastros-service.oficina.svc.cluster.local"
  AWS__Region: "us-east-1"
  AWS__Environment: "homolog"
  Messaging__Enabled: "true"
  # Preenchido com o output "billing_queue_url" do terraform apply.
  Messaging__QueueUrl: "https://sqs.us-east-1.amazonaws.com/CONTA/oficina-homolog-billing-queue"
