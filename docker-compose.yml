# Ambiente local do Billing Service.
#   docker compose up -d --build                     -> API + PostgreSQL + WireMock (Cadastros/OS), Mercado Pago FAKE, eventos só logados
#   docker compose --profile aws up -d --build       -> idem + LocalStack (SNS/SQS/SSM reais de mentira): Outbox publica de verdade e o consumidor lê a fila
# Para usar o sandbox REAL do Mercado Pago: MP_USE_FAKE=false MP_ACCESS_TOKEN=<token de teste> (ver README).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_billing
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d oficina_billing"]
      interval: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ["--global-response-templating"]
    ports:
      - "8081:8080"
    volumes:
      - ./kit/wiremock/mappings:/home/wiremock/mappings

  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    profiles: ["aws"]
    environment:
      SERVICES: sns,sqs,ssm
    ports:
      - "4566:4566"
    volumes:
      - ./kit/localstack/init.sh:/etc/localstack/init/ready.d/init.sh

  billing-api:
    build: .
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BillingDb: "Host=db;Port=5432;Database=oficina_billing;Username=billing_user;Password=changeme"
      Services__OsService__BaseUrl: "http://wiremock:8080"
      Services__CadastrosService__BaseUrl: "http://wiremock:8080"
      MercadoPago__UseFake: "${MP_USE_FAKE:-true}"
      MercadoPago__AccessToken: "${MP_ACCESS_TOKEN:-}"
      MercadoPago__NotificationUrl: "${MP_NOTIFICATION_URL:-}"
      MercadoPago__ValidateSignature: "${MP_VALIDATE_SIGNATURE:-false}"
      MercadoPago__WebhookSecret: "${MP_WEBHOOK_SECRET:-}"
      Messaging__Provider: "${MESSAGING_PROVIDER:-Log}"
      Messaging__ConsumerEnabled: "${MESSAGING_CONSUMER:-false}"
      Messaging__Environment: dev
      Aws__ServiceUrl: "${AWS_SERVICE_URL:-}"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  billing-db-data:
